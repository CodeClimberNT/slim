[project]
  name            = "slim"
  version         = "0.1.0"
  description     = "SLIM (Semantic Learning algorithm based on Inflate and deflate Mutation)"
  readme          = "README.md"
  requires-python = ">=3.12"
  authors         = [{ name = "CodeClimberNT", email = "59546514+CodeClimberNT@users.noreply.github.com" }]
  dependencies    = [
    "dill>=0.4.1",
    "joblib==1.4.2",
    "matplotlib>=3.11.2",
    "numpy~=2.5.5",
    "pandas~=3.1.1",
    "scikit-learn~=1.9.1",
    "scipy~=1.18.1",
    "setuptools~=84.2.1",
    "tensorboard>=2.21.0",
    "torch~=2.15.0",
]

  [project.scripts]
    example-gp = "slim_gsgp.example_gp:main"
    slim       = "slim:main"

[dependency-groups]
  dev = [
    "pytest~=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.100",
  ]

[build-system]
  requires      = ["uv_build>=0.12.23,<0.13.0"]
  build-backend = "uv_build"

[[tool.uv.index]]
  # name     = "pytorch-cu121"
  # url      = "https://download.pytorch.org/whl/cu121"
  name     = "pytorch-cu134"
  url      = "https://download.pytorch.org/whl/cu134"
  explicit = true

[tool.uv.build-backend]
  module-name = "slim_gsgp"
  module-root = ""

[tool.uv.sources]
  torch = [
    { index = "pytorch-cu134", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  ]
