[project]
  name            = "slim"
  version         = "0.1.0"
  description     = "SLIM (Semantic Learning algorithm based on Inflate and deflate Mutation)"
  readme          = "README.md"
  requires-python = ">=3.12,<3.13"
  authors         = [{ name = "CodeClimberNT", email = "59546514+CodeClimberNT@users.noreply.github.com" }]
  dependencies    = [
    "dill>=0.4.1",
    "joblib==1.4.2",
    "numpy~=2.0.2",
    "pandas~=2.2.3",
    "scikit-learn~=1.5.2",
    "scipy~=1.13.1",
    "setuptools~=75.1.0",
    "torch~=2.4.1",
  ]

  [project.scripts]
    example-gp = "slim_gsgp.example_gp:main"
    slim       = "slim:main"

[dependency-groups]
  dev = [
    "pytest~=8.3.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
  ]

[build-system]
  requires      = ["uv_build>=0.12.23,<0.13.0"]
  build-backend = "uv_build"

[[tool.uv.index]]
  name     = "pytorch-cu121"
  url      = "https://download.pytorch.org/whl/cu121"
  explicit = true

[tool.uv.build-backend]
  module-name = "slim_gsgp"
  module-root = ""

[tool.uv.sources]
  torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  ]
